<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="tablet.css"><title>Roleta dos Preguiçosos</title><style>*{box-sizing:border-box}body{margin:0;background:#020b17;color:#fff;font:15px system-ui}.app{max-width:560px;margin:auto;min-height:100vh;background:#061a33}.top{position:fixed;z-index:3;top:0;width:min(560px,100%);padding:15px;background:#061a33ee;display:flex;justify-content:space-between}.top b{color:#ffd52e}.feed{height:100vh;overflow:hidden}.q{min-height:100vh;padding:92px 18px 76px;display:flex;flex-direction:column;justify-content:center}.tag{color:#75c9ff;font-weight:800;font-size:12px}.topic{color:#aabbd0;margin:6px 0 18px}.q h1{font-size:21px;line-height:1.3;max-height:42vh;overflow:auto}.opt,.card{border-radius:14px}.opt{border:1px solid #24517c;background:#0b2848;color:#fff;padding:13px;text-align:left;margin:5px 0}.opt.ok{background:#0d6b46!important;border:2px solid #43e09d}.opt.no{background:#7a2635!important;border:2px solid #ff7188}.feedback{margin-top:10px;background:#0d2948;padding:12px;border-radius:14px;max-height:25vh;overflow:auto}.star{background:none;border:0;color:#ffd52e;margin-top:8px}.panel{padding:75px 16px 85px}.card{background:#0b2848;border:1px solid #24517c;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{font-size:24px;display:block}.hidden{display:none!important}.feedfilter{position:fixed;z-index:3;top:48px;width:min(560px,100%);display:flex;gap:6px;padding:7px 12px;background:#061a33ee}.feedfilter button{flex:1;border:1px solid #24517c;background:#0b2848;color:#aabbd0;padding:8px 4px;border-radius:10px;font-size:12px}.feedfilter button.on{background:#ffd52e;color:#07182e;font-weight:900}nav{position:fixed;z-index:4;bottom:0;width:min(560px,100%);display:flex;justify-content:space-around;background:#061a33f5;border-top:1px solid #234667;padding:8px}nav button{background:none;border:0;color:#aabbd0;font-size:11px}nav button.on{color:#fff}</style></head><body><div class="app"><div class="top"><b>ROLETA DOS PREGUIÇOSOS</b><small>ESTUDO • V1</small></div><div id="feedFilter" class="feedfilter"><button id="fp" class="on" onclick="setFeedMode('pending')">⏳ A resolver</button><button id="fr" onclick="setFeedMode('resolved')">✅ Resolvidas</button><button id="fa" onclick="setFeedMode('all')">📚 Todas</button></div><main id="feed" class="feed"><section class="q"><div class="card"><h2>Carregando questões…</h2></div></section></main><section id="stats" class="panel hidden"><h2>📊 Desempenho</h2><div class="grid"><div class="card metric"><strong id="an">0</strong>respondidas</div><div class="card metric"><strong id="ac">0</strong>acertos</div><div class="card metric"><strong id="rt">0%</strong>aproveitamento</div><div class="card metric"><strong id="fv">0</strong>favoritas</div></div><div class="card" id="bs"></div></section><section id="more" class="panel hidden"><h2>☰ Mais</h2><div class="card"><b>ℹ️ Roleta dos Preguiçosos</b><p>Aplicativo de estudo em formato de Shorts.</p><p id="bankInfo">Carregando banco…</p></div></section><nav><button id="nf" class="on" onclick="tab('feed')">🎬<br>Shorts</button><button id="nst" onclick="tab('stats')">📊<br>Desempenho</button><button id="nmo" onclick="tab('more')">☰<br>Mais</button></nav></div><script>const KEY='sefaz-hipotetico-state-v1';window.Q=[];function state(){try{return Object.assign({answers:{},fav:{}},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{answers:{},fav:{}}}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function stats(){let s=state(),a=Object.values(s.answers),ok=a.filter(x=>x.correct).length;document.getElementById('an').textContent=a.length;document.getElementById('ac').textContent=ok;document.getElementById('rt').textContent=a.length?Math.round(ok/a.length*100)+'%':'0%';document.getElementById('fv').textContent=Object.keys(s.fav).length;document.getElementById('bs').innerHTML='<b>Banco carregado nesta sessão</b><p>'+window.Q.length+' questões em memória.</p>'}function tab(id){document.querySelectorAll('.app>main,.app>section').forEach(e=>e.classList.add('hidden'));document.getElementById(id)?.classList.remove('hidden');document.getElementById('feedFilter')?.classList.toggle('hidden',id!=='feed');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));let n={feed:'nf',stats:'nst',more:'nmo'}[id];if(n)document.getElementById(n)?.classList.add('on');if(id==='stats')stats()}</script><script src="performance.js?v=10"></script><script src="sharded-bank.js?v=10"></script><script src="filter-visibility.js?v=10"></script><script src="cycle-timer.js?v=10"></script><script src="backup.js?v=10"></script><script src="offline.js?v=10"></script><script>window.addEventListener('DOMContentLoaded',()=>window.loadBank?.());</script></body></html>
