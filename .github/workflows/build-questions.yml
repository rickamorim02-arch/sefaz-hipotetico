name: Gerar e auditar banco de Shorts

'on':
  workflow_dispatch:
  push:
    paths:
      - tools/build_questions.py
      - tools/build_approved_bank.py
      - tools/audit_restructure_questions.py
      - tools/audit_20_workers.py
      - tools/shard_questions.py
      - AUDIT_TRIGGER.txt
      - reading-manifest.json
      - reading-*.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar banco base
        run: python tools/build_questions.py . questions.json
      - name: Gerar banco aprovado sem sobrescrever original
        run: python tools/build_approved_bank.py questions.json questions-approved.json
      - name: Auditar banco aprovado com 20 auditores
        run: |
          cp questions.json questions-original.tmp
          cp questions-approved.json questions.json
          python tools/audit_20_workers.py .
          mv structural-audit.json structural-approved-audit.json
          mv questions-original.tmp questions.json
      - name: Validar resultado aprovado
        run: |
          python - <<'PY'
          import json
          approved=json.load(open('questions-approved.json',encoding='utf-8'))
          dropped=json.load(open('structural-dropped.json',encoding='utf-8'))
          audit=json.load(open('structural-approved-audit.json',encoding='utf-8'))
          assert dropped['total_original']==dropped['aprovadas']+dropped['dispensadas']
          assert len(approved)==dropped['aprovadas']==audit['total']
          assert audit['auditores']==20
          assert audit['nao_passam']==0
          assert audit['passam']==audit['total']
          print('BANCO APROVADO=',len(approved),'DISPENSADOS=',dropped['dispensadas'],'FALHAS=',audit['nao_passam'])
          PY
      - name: Publicar candidato aprovado e relatórios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add questions-approved.json structural-dropped.json structural-approved-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publica banco estruturalmente aprovado e auditoria final'
          git push
