name: Gerar e auditar banco de Shorts
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_questions.py'
      - 'tools/shard_questions.py'
      - 'tools/audit_restructure_questions.py'
      - 'tools/audit_20_workers.py'
      - 'AUDIT_TRIGGER.txt'
      - 'reading-manifest.json'
      - 'reading-*.json'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar banco
        run: python tools/build_questions.py . questions.json
      - name: Auditar banco
        run: |
          python - <<'PY'
          import json,re
          q=json.load(open('questions.json',encoding='utf-8')); norm=lambda s:re.sub(r'\W+',' ',s.lower(),flags=re.UNICODE).strip(); n=len(q)
          assert 1<=n<=50000 and len({x['s'] for x in q})==19 and len({x['id'] for x in q})==n and len({norm(x['q']) for x in q})==n
          assert all(x['q'] and x['c'] and x['lesson'] and x['source'] for x in q)
          print('APROVADO:',n)
          PY
      - name: Fragmentar
        run: python tools/shard_questions.py questions.json questions-data 500
      - name: Executar 20 auditores artificiais
        run: python tools/audit_20_workers.py .
      - name: Validar cobertura dos 20 auditores
        run: |
          python - <<'PY'
          import json
          r=json.load(open('structural-audit.json',encoding='utf-8'))
          assert r['auditores']==20
          assert sum(x['analisadas'] for x in r['por_auditor'])==r['total']
          assert r['passam']+r['nao_passam']==r['total']
          assert len(r['falhas'])==r['nao_passam']
          print('COBERTURA CENSITÁRIA APROVADA:',r['total'])
          PY
      - name: Publicar banco e relatório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add questions.json questions-manifest.json questions-data structural-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publica auditoria estrutural por 20 auditores'
          git push