name: Gerar e auditar base de leitura V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/Compilacao_SEFAZ_AL_Auditada_V2.zip'
      - 'tools/build_reading.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar arquivos por disciplina
        run: |
          rm -rf reading-build
          python tools/build_reading.py source/Compilacao_SEFAZ_AL_Auditada_V2.zip reading-build
          cp reading-build/reading-*.json .
          cp reading-build/reading-manifest.json .
      - name: Auditar estrutura e integridade
        run: |
          python - <<'PY'
          import json, pathlib, re
          m=json.load(open('reading-manifest.json',encoding='utf-8'))
          assert len(m)==19, f'Disciplinas: {len(m)} != 19'
          total=0
          bad=[]
          mojibake=re.compile(r'[├┬]')
          for x in m:
              assert not mojibake.search(x['subject']), f'Nome corrompido: {x["subject"]}'
              p=pathlib.Path(x['file'])
              assert p.exists(), f'Arquivo ausente: {p}'
              d=json.load(open(p,encoding='utf-8'))
              assert len(d)==x['lessons'], (x['subject'],len(d),x['lessons'])
              assert d, f'Vazio: {x["subject"]}'
              assert all(r.get('subject')==x['subject'] for r in d), x['subject']
              assert all(r.get('lesson') and r.get('text') for r in d), x['subject']
              total += len(d)
          assert total==255, f'Fontes/aulas: {total} != 255'
          print(f'APROVADO: {len(m)} disciplinas; {total} fontes/aulas; nomes e JSON íntegros')
          PY
      - name: Publicar base aprovada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading-*.json reading-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Regenera base V2 auditada: 19 disciplinas e 255 fontes'
          git push