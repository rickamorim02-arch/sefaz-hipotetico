name: Auditar qualidade pedagógica dos Shorts
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/audit_questions_quality.py'
      - 'questions.json'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auditar 50 mil itens
        run: python tools/audit_questions_quality.py questions.json
      - name: Publicar relatório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add questions-quality-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publica relatório de qualidade pedagógica dos Shorts'
          git push